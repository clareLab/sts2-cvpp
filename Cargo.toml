[workspace]
members = ["core", "worker"]
resolver = "3"

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.85"
authors = ["clareLab <yaho@clareLab.moe>"]
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
